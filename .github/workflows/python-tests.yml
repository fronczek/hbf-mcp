name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install server, CLI and test dependencies
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Compile server, shared services and tests
        run: python -m compileall -q src tests *.py
      - name: Run offline regression tests
        run: python -m pytest -q
      - name: Build compatible CLI wheel
        run: python -m pip wheel --no-deps --wheel-dir /tmp/hbf-mcp-wheels .
